[package]
name = "veya-signing-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
apple-codesign = { package = "isideload-apple-codesign", version = "=0.29.11" }
plist = "=1.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
x509-certificate = { package = "isideload-x509-certificate", version = "=0.26.1" }
zeroize = { version = "1.8", features = ["derive"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
security-framework = { version = "2.11", features = ["OSX_10_14"] }
security-framework-sys = "2.17"

[dev-dependencies]
hex = "0.4"
openssl = { version = "=0.10.76", features = ["vendored"] }
